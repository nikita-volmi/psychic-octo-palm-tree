# Docs for the Azure Web Apps Deploy action: https://go.microsoft.com/fwlink/?linkid=2134798
# More GitHub Actions for Azure: https://go.microsoft.com/fwlink/?linkid=2135048

name: Azure App Service - psychic-octo-palm-tree-156af1fa(Production), Build and deploy container app

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # checkout the repo
    - name: 'Checkout Github Action'
      uses: actions/checkout@master


    - uses: azure/docker-login@v1
      with:
        login-server: https://testprjct.azurecr.io/
        username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_70148B3FA5464D569CCA5A48C58CBB6F }}
        password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_A10AE848E68146ABB3DFF43AE1A65A49 }}

    - run: |
        docker build . -t testprjct.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_70148B3FA5464D569CCA5A48C58CBB6F }}/testprjct.azurecr.io/backend-auth:latest:${{ github.sha }}
        docker push testprjct.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_70148B3FA5464D569CCA5A48C58CBB6F }}/testprjct.azurecr.io/backend-auth:latest:${{ github.sha }}

    - uses: azure/webapps-deploy@v2
      with:
        app-name: psychic-octo-palm-tree-156af1fa
        slot-name: Production
        publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_BC36A8588FFA4DE99B0C24CC69BA6920 }}
        images: testprjct.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_70148B3FA5464D569CCA5A48C58CBB6F }}/testprjct.azurecr.io/backend-auth:latest:${{ github.sha }}

