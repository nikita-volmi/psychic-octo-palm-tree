name: Build and Push Images to Azure ACR

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - service: backend-auth
            context: services/backend-auth
          - service: backend-game
            context: services/backend-game
          - service: frontend
            context: services/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_REGISTRY_URL }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.AZURE_REGISTRY_URL }}/${{ matrix.service }}:latest
            ${{ secrets.AZURE_REGISTRY_URL }}/${{ matrix.service }}:${{ github.sha }}
          build-args: |
            VITE_AUTH_API_URL=${{ vars.VITE_AUTH_API_URL }}
            VITE_GAME_API_URL=${{ vars.VITE_GAME_API_URL }}
